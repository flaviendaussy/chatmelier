name: Deploy Chatmelier Web to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Ce site (flaviendaussy.github.io/chatmelier) double le site officiel
      # (chatmelier.github.io, publié par build_and_sync_web.sh). Sans numéro de version, ses
      # remontées arrivaient en « dev » : le suffixe « -pages » les distingue (V2.4 · K10).
      - name: Build Flutter Web
        working-directory: app
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          flutter build web --base-href="/chatmelier/" --release --dart-define=CHATMELIER_VERSION="${VERSION}-pages"
          cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
