name: iPhone

# Construit l'app iPhone sur un Mac de GitHub (gratuit pour un dépôt public) : Linux ne
# compile pas pour iOS. Lancement à la main : onglet Actions → iPhone → Run workflow, ou
# `gh workflow run ios.yml -f envoyer=true`.
#
#   envoyer = false : vérifie seulement que l'app compile pour iPhone, sans signature ;
#   envoyer = true  : signe, construit l'IPA et l'envoie sur App Store Connect (TestFlight).
#
# L'envoi lit quatre secrets du dépôt (Settings → Secrets and variables → Actions), que seul
# Flavien crée :
#   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
#     — une clé API App Store Connect (Users and Access → Integrations), rôle « App Manager » ;
#   CERTIFICATE_PRIVATE_KEY — la clé RSA du certificat de distribution, créée une fois.
# Aucune clé n'est écrite ici, et GitHub masque les secrets dans les journaux (publics).

on:
  workflow_dispatch:
    inputs:
      envoyer:
        description: "Signer et envoyer sur TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iphone
  cancel-in-progress: false

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.chatmelier.chatmelier
    steps:
      - name: Code
        uses: actions/checkout@v4

      # App Store Connect n'accepte que les apps construites avec le SDK iOS récent.
      - name: Xcode le plus récent
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Flutter, même version que les builds Android
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Dépendances
        working-directory: app
        run: flutter pub get

      # L'adresse Supabase et la clé publiable, les mêmes que pour le web et Android (elles
      # sont dans chaque APK et sur le site) : lues dans le script du web, pas recopiées ici.
      - name: Valeurs publiques de l'app
        run: |
          grep -E '^SUPABASE_(URL|ANON_KEY)=' build_and_sync_web.sh | tr -d '"' >> "$GITHUB_ENV"
          echo "CHATMELIER_VERSION=$(grep '^version: ' app/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Compiler pour iPhone, sans signature
        if: ${{ !inputs.envoyer }}
        working-directory: app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=CHATMELIER_VERSION="$CHATMELIER_VERSION"

      # Certificat de distribution et profil App Store, créés au premier passage puis
      # réutilisés (outils libres de Codemagic, sans compte Codemagic).
      - name: Signature
        if: ${{ inputs.envoyer }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project app/ios/Runner.xcodeproj

      - name: Construire l'IPA
        if: ${{ inputs.envoyer }}
        working-directory: app
        run: |
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=CHATMELIER_VERSION="$CHATMELIER_VERSION"

      - name: Envoyer sur App Store Connect
        if: ${{ inputs.envoyer }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: app-store-connect publish --path "$(find app/build/ios/ipa -name '*.ipa' | head -1)"
