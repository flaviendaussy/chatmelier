name: chatmelier
description: A wine cellar management app.
publish_to: 'none'
version: 1.2.0+22

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  go_router: ^14.8.0
  image_picker: ^1.1.0
  camera: ^0.12.0
  cached_network_image: ^3.4.0
  fl_chart: ^0.70.0
  intl: '>=0.19.0 <1.0.0'
  uuid: ^4.5.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.0
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  csv: ^6.0.0
  flutter_markdown: ^0.7.7+1
  geolocator: ^13.0.1
  network_info_plus: ^6.1.0
  pdf: ^3.13.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.6.0
  riverpod_lint: ^2.6.0
  custom_lint: ^0.7.0
  json_serializable: ^6.8.0
  freezed: ^2.5.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/animations/
